[project]
name = "azurecost"
version = "0.4.0"
description = "Simple and easy command line to view azure costs."
authors = [{ name="Hiroshi Toyama", email="toyama0919@gmail.com" }]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = [
  "azure",
  "cost",
  "tool",
  "costmanagement",
]
requires-python = ">=3.8"
dependencies = [
  "tabulate",
  "click>=7.0",
  "azure-identity",
  "azure-mgmt-core",
  "azure-mgmt-costmanagement",
  "azure-mgmt-resource",
  # azure-mgmt-resource 25.0.0 split SubscriptionClient out into its own
  # distribution. It requires Python 3.10+, which is also the floor of the
  # azure-mgmt-resource releases that need it, so older interpreters keep
  # resolving to a release that still bundles SubscriptionClient.
  "azure-mgmt-resource-subscriptions; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
test = [
  "tox",
]

[project.scripts]
azurecost = "azurecost.commands:main"

[project.urls]
"Homepage" = "https://github.com/toyama0919/azurecost"
