[project]
name = "azurecost"
version = "0.4.0"
description = "Simple and easy command line to view azure costs."
authors = [{ name="Hiroshi Toyama", email="toyama0919@gmail.com" }]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = [
  "azure",
  "cost",
  "tool",
  "costmanagement",
]
requires-python = ">=3.10"
dependencies = [
  "tabulate",
  "click>=7.0",
  "azure-identity",
  "azure-mgmt-core",
  "azure-mgmt-costmanagement>=5",
  "azure-mgmt-resource>=25",
  # SubscriptionClient lives here since azure-mgmt-resource 25.0.0 split it out.
  "azure-mgmt-resource-subscriptions",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
test = [
  "tox",
]

[project.scripts]
azurecost = "azurecost.commands:main"

[project.urls]
"Homepage" = "https://github.com/toyama0919/azurecost"
